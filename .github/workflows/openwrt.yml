name: OpenWrt x86_64 Daed + Passwall2 Build

on:
  workflow_dispatch:
  push:
    #自动执行开
    # branches:
    #   - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    # 必须赋予写权限，否则无法创建 Release
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y qemu-utils bc binutils-gold bison build-essential ccache ecj fastjar file flex g++ gawk gcc-arm* gettext git help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev libssl-dev mtd-utils meson mold mtd-utils ninja-build pbzip2 pigz pkg-config python3-dev python3-setuptools rsync subversion swig texinfo time u-boot-tools unzip wget xsltproc xxd zlib1g-dev zstd clang llvm npm cmake
        sudo npm install -g pnpm
    - name: Clone OpenWrt
      run: |
        git clone https://github.com/openwrt/openwrt.git -b v25.12.6 openwrt
        cd openwrt
        #git clone https://github.com/QiuSimons/luci-app-daed package/dae
        #git clone https://github.com/kenzok8/openwrt-clashoo.git package/openwrt-clashoo
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 移除 openwrt feeds 自带的核心库
        # git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/passwall-packages
        # 移除 openwrt feeds 过时的luci版本
        #rm -rf feeds/luci/applications/luci-app-passwall
        #git clone https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall-luci
        #git clone --depth=1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash
        #git clone https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns   
        sed -i 's/192.168.1.1/192.168.5.1/g' package/base-files/files/bin/config_generate

    - name: Apply .config
      run: |
        cd openwrt
        rm -f .config
        rm -f tmp/.config-package.in
        cat << 'EOF' > .config
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_VHDX_IMAGES=y
        EOF
        
        cat << 'EOF' >> .config
        # ===== eBPF & BTF 深度内核黄金配置 =====
        CONFIG_KERNEL_BPF=y
        CONFIG_KERNEL_BPF_SYSCALL=y
        CONFIG_KERNEL_BPF_JIT=y
        CONFIG_KERNEL_CGROUPS=y
        CONFIG_KERNEL_KPROBES=y
        CONFIG_KERNEL_NET_INGRESS=y
        CONFIG_KERNEL_NET_EGRESS=y
        CONFIG_KERNEL_NET_SCH_INGRESS=m
        CONFIG_KERNEL_NET_CLS_BPF=m
        CONFIG_KERNEL_NET_CLS_ACT=y
        CONFIG_KERNEL_BPF_STREAM_PARSER=y
        CONFIG_KERNEL_DEBUG_INFO=y
        CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
        CONFIG_KERNEL_DEBUG_INFO_BTF=y
        CONFIG_KERNEL_KPROBE_EVENTS=y
        CONFIG_KERNEL_BPF_EVENTS=y
        
        # ===== 网页后台 & 简体中文 & 网页终端 =====
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_LUCI_LANG_zh-cn=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
        CONFIG_PACKAGE_ttyd=y
        
        # ===== 固件分区深度扩容 (防体积爆炸) =====
        CONFIG_TARGET_KERNEL_PARTSIZE=200
        CONFIG_TARGET_ROOTFS_PARTSIZE=300
        
        # ===== 拒绝多余格式：精简为纯原生固件 =====
        CONFIG_TARGET_IMAGES_GZIP=n
        CONFIG_TARGET_ROOTFS_TARGZ=n
        CONFIG_TARGET_ROOTFS_EXT4FS=n
        CONFIG_X86_GRUB_EFI_IMAGES=n
        
        # ===== 高级分流网络组件无缝替换 =====
        CONFIG_PACKAGE_dnsmasq=n
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_dnsmasq_full_dhcp=y
        CONFIG_PACKAGE_dnsmasq_full_dnssec=y
        CONFIG_PACKAGE_dnsmasq_full_ipset=y
        CONFIG_PACKAGE_dnsmasq_full_nftset=y
        
        # ===== USB 3.0 / 2.0 控制器及外挂 USB 有线网卡与存储驱动 =====
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-scsi-core=y
        
        # ===== 彻底剥离全套无用 IPv6 功能 (只要纯净 IPv4) =====
        CONFIG_VOLUME_DEFAULTS_IPV6=n
        CONFIG_IPV6=n
        CONFIG_KERNEL_IPV6=n
        CONFIG_PACKAGE_kmod-ipv6=n
        CONFIG_PACKAGE_kmod-ipt-ipv6=n
        CONFIG_PACKAGE_kmod-nf-ipt6=n
        CONFIG_PACKAGE_kmod-ip6tables=n
        CONFIG_PACKAGE_ip6tables=n
        CONFIG_PACKAGE_ip6tables-extra=n
        CONFIG_PACKAGE_ip6tables-mod-nat=n
        CONFIG_PACKAGE_dnsmasq_full_dhcpv6=n
        CONFIG_PACKAGE_odhcpd=n
        CONFIG_PACKAGE_odhcpd-ipv6only=n
        CONFIG_PACKAGE_luci-proto-ipv6=n
        EOF
       
        #  echo "CONFIG_NETKIT=y" >>  target/linux/x86/config-6.12        
        make defconfig       
    - name: 下载依赖
      run: |
        cd openwrt
        make download -j8
    - name: 开始编译
      run: |
        cd openwrt
        make -j4 V=s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-x86_64-Daed-Passwall2
        path: openwrt/bin/targets
       # 3. 发布到 GitHub Releases
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        # 要上传的文件路径，支持通配符
        files: |
          openwrt/bin/targets/*/*/*.img.gz
          openwrt/bin/targets/*/*/*.img.gz
          openwrt/bin/targets/*/*/*.vhdx
        generate_release_notes: true
