name: OpenWrt x86_64 Daed + Passwall2 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl

    - name: Clone OpenWrt
      run: |
        git clone https://github.com/openwrt/openwrt.git -b master openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Replace feeds.conf.default
      run: |
        python3 - <<'PY'
        import textwrap
        feed = textwrap.dedent("""\
        src-git packages https://github.com/openwrt/packages.git
        src-git luci https://github.com/openwrt/luci.git
        src-git routing https://github.com/openwrt/routing.git
        src-git telephony https://github.com/openwrt/telephony.git
        src-git video https://github.com/openwrt/video.git
        src-git daed https://github.com/daeuniverse/daed.git
        src-git luci_app_daed https://github.com/QiuSimons/luci-app-daed.git
        src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git
        """)
        with open('openwrt/feeds.conf.default', 'w', encoding='utf-8') as f:
            f.write(feed)
        print('=== feeds.conf.default ===')
        print(feed)
        PY

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply .config
      run: |
        cd openwrt
        cat > .config << 'EOF'
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        
        CONFIG_KERNEL_BPF_EVENTS=y
        CONFIG_KERNEL_DEBUG_INFO_BTF=y
        CONFIG_KERNEL_XDP_SOCKETS=y
        CONFIG_KERNEL_BPF_SYSCALL=y
        CONFIG_KERNEL_BPF_JIT=y
        CONFIG_KERNEL_BPF_STREAM_PARSER=y
        
        CONFIG_DEVEL=y
        CONFIG_BPF_TOOLCHAIN_BUILD_LLVM=y
        CONFIG_BPF_TOOLCHAIN_HOST_LLVM=y
        
        CONFIG_PACKAGE_ca-certificates=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_ip-full=y

        CONFIG_PACKAGE_daed=y
        CONFIG_PACKAGE_luci-app-daed=y

        CONFIG_PACKAGE_passwall2=y
        CONFIG_PACKAGE_xray-core=y
        CONFIG_PACKAGE_v2ray-core=y
        CONFIG_PACKAGE_sing-box=y
        CONFIG_PACKAGE_hysteria=y
        CONFIG_PACKAGE_hysteria2=y
        CONFIG_PACKAGE_tuic-client=y
        CONFIG_PACKAGE_naiveproxy=y
        
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_chinadns-ng=y
        
        CONFIG_PACKAGE_kmod-nft-core=y
        CONFIG_PACKAGE_kmod-nft-tproxy=y
        CONFIG_PACKAGE_kmod-nft-fullcone=y
        CONFIG_PACKAGE_kmod-nft-nat=y
        
        CONFIG_PACKAGE_kmod-bpf=y
        CONFIG_PACKAGE_kmod-bpf-test=y
        CONFIG_PACKAGE_kmod-xdp-sockets=y
        CONFIG_PACKAGE_kmod-tun=y
        
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb3=y
        
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-usb-storage-extras=y
        CONFIG_PACKAGE_kmod-scsi-core=y
        
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_kmod-fs-ntfs=y
        CONFIG_PACKAGE_ntfs-3g=y
        
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-asix=y
        CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
        CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
        
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_coreutils=y
        CONFIG_PACKAGE_coreutils-base64=y
        CONFIG_PACKAGE_bash=y
        
        CONFIG_PACKAGE_iptables-nft=y
        CONFIG_PACKAGE_nftables=y
        CONFIG_PACKAGE_ipset=y
        CONFIG_PACKAGE_kmod-ipset=y
        EOF

    - name: Make defconfig
      run: |
        cd openwrt
        make defconfig

    - name: Download Sources
      run: |
        cd openwrt
        make download -j8

    - name: Build Firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-x86_64-Daed-Passwall2
        path: openwrt/bin/targets
