name: OpenWrt x86_64 Daed + Passwall2 Build

on:
  workflow_dispatch:
  push:
    #自动执行开
    # branches:
    #   - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    # 必须赋予写权限，否则无法创建 Release
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y qemu-utils bc binutils-gold bison build-essential ccache ecj fastjar file flex g++ gawk gcc-arm* gettext git help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev libssl-dev mtd-utils meson mold mtd-utils ninja-build pbzip2 pigz pkg-config python3-dev python3-setuptools rsync subversion swig texinfo time u-boot-tools unzip wget xsltproc xxd zlib1g-dev zstd clang llvm npm cmake
        sudo npm install -g pnpm
    - name: Clone OpenWrt
      run: |
        git clone https://github.com/openwrt/openwrt.git -b v25.12.4 openwrt
        cd openwrt
        git clone https://github.com/QiuSimons/luci-app-daed package/dae
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 移除 openwrt feeds 自带的核心库
        rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls}
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/passwall-packages
        # 移除 openwrt feeds 过时的luci版本
        rm -rf feeds/luci/applications/luci-app-passwall
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall-luci

        #--------luci-app-mosdns
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang
        # remove v2ray-geodata package from feeds
        rm -rf feeds/packages/net/v2ray-geodata
        git clone https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns
        git clone https://github.com/sbwml/v2ray-geodata package/v2ray-geodata



        
        sed -i 's/192.168.1.1/192.168.5.1/g' package/base-files/files/bin/config_generate

    - name: Apply .config
      run: |
        cd openwrt
        cat > .config << 'EOF'
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        # 关闭不需要的归档格式
        # CONFIG_TARGET_ROOTFS_CPIOGZ is not set
        # CONFIG_TARGET_ROOTFS_TARGZ is not set
        # 开启 Hyper-V VHDX 镜像输出
        CONFIG_TARGET_IMAGES_VHDX=y         
        CONFIG_TARGET_IMAGE_VHDX_SIZE=1024  
        # 推荐的 rootfs 类型（VHDX 通常基于 ext4）
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        #CONFIG_TARGET_ROOTFS_EXT4FS=y
        # 修改分区大小 (单位: MiB)
        CONFIG_TARGET_KERNEL_PARTSIZE=200
        CONFIG_TARGET_ROOTFS_PARTSIZE=300
        CONFIG_DEVEL=y
        CONFIG_BPF_TOOLCHAIN_HOST=y
        CONFIG_BPF_TOOLCHAIN_HOST_PATH="/usr/lib/llvm-18/bin"
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
        CONFIG_PACKAGE_kmod-usb-ohci=y
        CONFIG_PACKAGE_kmod-usb-ohci-pci=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-usb-storage-extras=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_luci=y
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-app-daed=y
        CONFIG_DEVEL=y
        CONFIG_KERNEL_DEBUG_INFO=y
        CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
        CONFIG_KERNEL_DEBUG_INFO_BTF=y
        CONFIG_KERNEL_CGROUPS=y
        CONFIG_KERNEL_CGROUP_BPF=y
        CONFIG_KERNEL_BPF_EVENTS=y
        CONFIG_BPF_TOOLCHAIN_HOST=y
        CONFIG_KERNEL_XDP_SOCKETS=y
        CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
        # === daed Netkit 优化 ===
        CONFIG_PACKAGE_ip-full=y
        CONFIG_NETKIT=y
        # === luci-app-passwall ===
        CONFIG_PACKAGE_luci-app-passwall=y
        # MosDNS（新增）
        CONFIG_PACKAGE_luci-app-mosdns=y
        CONFIG_PACKAGE_mosdns=y
        CONFIG_PACKAGE_v2ray-geodata=y
        EOF
        
        make defconfig       
    - name: 下载依赖
      run: |
        cd openwrt
        make download -j8
    - name: 开始编译
      run: |
        cd openwrt
        make -j4 V=s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-x86_64-Daed-Passwall2
        path: openwrt/bin/targets
       # 3. 发布到 GitHub Releases
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        # 要上传的文件路径，支持通配符
        files: |
          openwrt/bin/targets/*/*/*.img.gz
          openwrt/bin/targets/*/*/*.manifest
        generate_release_notes: true
